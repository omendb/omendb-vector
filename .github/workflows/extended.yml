name: Extended validation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mojo-tests:
    name: Mojo tests
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/default/lib
      LD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/default/lib
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.63.2
          locked: true
      - name: Run Mojo tests
        run: |
          for test in src/*_test.mojo; do
            pixi run mojo run "$test"
          done
