name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONNOUSERSITE: '1'

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.63.2
          locked: true

      - name: Build Mojo engine
        run: pixi run mojo build src/python_engine.mojo --emit shared-lib -o src/omendb/_omendb_engine.so

      - name: Install package
        run: pixi run uv pip install -e .

      - name: Ruff
        run: |
          pixi run ruff check --ignore E501 src/omendb scripts examples tests/test_python_api.py
          pixi run ruff format --check --exclude 'src/omendb/_omendb_engine.pyi' src/omendb scripts examples tests/test_python_api.py

      - name: Mojo format
        run: pixi run mojo format --quiet src/

      - name: Python tests
        run: pixi run python -m pytest tests -q

      - name: Quickstart smoke
        run: pixi run python examples/quickstart.py --help

  extended:
    name: Extended Mojo checks
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.63.2
          locked: true
      - name: Run Mojo tests
        run: |
          for test in src/*_test.mojo; do
            pixi run mojo run "$test"
          done
