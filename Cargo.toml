[workspace]
resolver = "2"
members = ["crates/engine"]
exclude = ["crates/python"]  # maturin-built binding crate; own toolchain gates

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/omendb/omendb-vector"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
