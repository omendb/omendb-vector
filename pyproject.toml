[project]
name = "omendb"
version = "0.1.0a1"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.14"
dependencies = []
description = "OmenDB: embedded local database for hybrid vector + text search with source evidence"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/omendb"]
artifacts = ["src/omendb/_omendb_engine.so"]

[project.scripts]
omendb-check = "omendb._cli:store_check"
omendb-engine-check = "omendb._cli:engine_check"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "B905", "F841"]
"benchmarks/*" = ["E501"]
"scripts/*" = ["E501", "F841"]
